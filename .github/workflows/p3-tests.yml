# Synthetic Q2 trial workflow (intentionally non-conforming delivery).
# Jobs: p3-tests (stub), p3-codex-verdict (Actions success stub).
# Same pull_request trigger set as Q1, including edited.

name: p3-tests

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - edited
      - ready_for_review
  workflow_dispatch:

permissions:
  contents: read

jobs:
  p3-tests:
    name: p3-tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Stub without running the test suite
        run: |
          echo "p3-tests: message-only stub; relevant suite not executed"

  p3-codex-verdict:
    name: p3-codex-verdict
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Actions success stub
        run: |
          echo "p3-codex-verdict: GitHub Actions job succeeded"
